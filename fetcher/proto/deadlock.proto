// The subset of Deadlock's Game Coordinator messages this service uses.
// Field numbers are copied from SteamDatabase/Protobufs (deadlock/citadel_gcmessages_client.proto,
// citadel_gcmessages_common.proto and gcsdk_gcmessages.proto); fields we don't read are left out and skipped on decode.
syntax = "proto2";

// k_EMsgGCClientHello = 4006. Deadlock runs on Source 2; a hello that leaves `engine` at its
// default (Source 1) is ignored and the GC never sends its welcome.
message CMsgClientHello {
  optional uint32 client_session_need = 3;
  optional uint32 client_launcher = 4; // PartnerAccountType; 0 = PARTNER_NONE
  optional uint32 engine = 7;          // ESourceEngine; 1 = k_ESE_Source2
}

// k_EMsgGCClientConnectionStatus = 4009: the GC tells the client its session state changed,
// e.g. it is restarting for a game update (GC_GOING_DOWN) or lost our session (NO_SESSION).
message CMsgConnectionStatus {
  optional uint32 status = 1; // GCConnectionStatus; 0 = HAVE_SESSION
}

// k_EMsgClientToGCGetMatchHistory = 9112, response 9113
message CMsgClientToGCGetMatchHistory {
  optional uint32 account_id = 1;
  optional uint64 continue_cursor = 2;
}

message CMsgClientToGCGetMatchHistoryResponse {
  message Match {
    optional uint64 match_id = 1;
    optional uint32 hero_id = 2;
    optional uint32 match_duration_s = 3;
    optional uint32 start_time = 4;
    optional uint32 match_result = 5;
    optional uint32 player_team = 6;
    optional uint32 player_kills = 7;
    optional uint32 player_deaths = 8;
    optional uint32 player_assists = 9;
    optional uint32 last_hits = 11;
    optional uint32 denies = 12;
    optional uint32 hero_level = 13;
    optional uint32 net_worth = 14;
    optional uint32 match_mode = 19;
    optional uint32 game_mode = 20;
    // EPlayerMatchOutcome: 1 win, 2 loss, 3 penalized (left), 4 penalized party, 5 not scored
    optional uint32 player_match_outcome = 26;
  }
  optional uint32 result = 1;  // 1 success, 2 invalid permission (not a friend / private), 5 rate limited
  optional uint64 continue_cursor = 2;
  repeated Match matches = 3;
}

// k_EMsgClientToGCGetMatchMetaData = 9167, response 9168
message CMsgClientToGCGetMatchMetaData {
  optional uint64 match_id = 1;
  // Whose match history the match was opened from; the game client sends it.
  optional uint32 target_account_id = 4;
}

message CMsgClientToGCGetMatchMetaDataResponse {
  optional uint32 result = 1;  // 1 success, 5 rate limited, 6 invalid match, 7 match in flight
  optional uint32 replay_salt = 2;
  optional uint32 metadata_salt = 3;
  optional uint32 replay_valid_through = 4;
  optional uint32 replay_group_id = 5;
}

// The .meta.bz2 file from replay<group>.valve.net, after bzip2 decompression.
message CMsgMatchMetaData {
  optional uint32 version = 1;
  optional bytes match_details = 2;  // a CMsgMatchMetaDataContents
  optional uint64 match_id = 3;
}

// Only in ranked matches.
message CMsgMatchPlayerRankData {
  optional uint32 initial_display_rank = 1;  // the badge the player entered the match with: tier*10 + subrank
}

message CMsgMatchMetaDataContents {
  message PlayerStats {
    optional uint32 time_stamp_s = 1;
    optional uint32 net_worth = 2;
    optional uint32 player_damage = 21;
    optional uint32 boss_damage = 23;
    optional uint32 teammate_healing = 45;
  }
  message Players {
    optional uint32 account_id = 1;
    optional uint32 player_slot = 2;
    repeated PlayerStats stats = 5;
    optional uint32 team = 6;
    optional uint32 kills = 8;
    optional uint32 deaths = 9;
    optional uint32 assists = 10;
    optional uint32 net_worth = 11;
    optional uint32 hero_id = 12;
    optional uint32 abandon_match_time_s = 23;
    optional uint32 mvp_rank = 28;
    optional CMsgMatchPlayerRankData player_rank_data = 32;
  }
  message MatchInfo {
    optional uint32 duration_s = 1;
    optional uint32 match_outcome = 2;
    optional uint32 winning_team = 3;
    repeated Players players = 4;
    optional uint32 start_time = 5;
    optional uint64 match_id = 6;
    optional uint32 game_mode = 9;
    optional uint32 match_mode = 10;
    // Which matchmaking pool the match was made in.
    optional bool is_high_skill_range_parties = 20;
    optional bool low_pri_pool = 21;
    optional bool new_player_pool = 22;
    optional uint32 average_badge_team0 = 23;
    optional uint32 average_badge_team1 = 24;
    optional bool not_scored = 27;  // e.g. someone left early: played out, but doesn't count
  }
  optional MatchInfo match_info = 2;
}

// A hero build, as the game's build editor saves it (citadel_gcmessages_common.proto).
message CMsgHeroBuild {
  message BuildModEntry {
    optional uint32 ability_id = 1;       // the shop item
    optional string annotation = 2;
    optional uint32 required_flex_slots = 3;
    optional uint32 sell_priority = 4;
    optional uint32 imbue_target_ability_id = 5;
  }
  message BuildModCategory {
    repeated BuildModEntry mods = 1;
    optional string name = 2;
    optional string description = 3;
    optional float width = 4;
    optional float height = 5;
    optional bool optional = 6;
  }
  message CurrencyChange {
    optional uint32 ability_id = 1;
    optional int32 currency_type = 2;     // 2 ability unlock, 1 ability points
    optional int32 delta = 3;             // -1, -2, -5: the first, second, third upgrade
    optional string annotation = 4;
  }
  message AbilityOrder {
    repeated CurrencyChange currency_changes = 1;
  }
  message Details_V0 {
    repeated BuildModCategory mod_categories = 1;
    optional AbilityOrder ability_order = 2;
  }
  optional uint32 hero_build_id = 1;      // 0: a new build
  optional uint32 hero_id = 2;
  optional uint32 author_account_id = 3;
  optional uint32 last_updated_timestamp = 4;
  optional string name = 5;
  optional string description = 6;
  optional uint32 language = 7;
  optional uint32 version = 8;            // the version being replaced, for an update
  optional uint32 origin_build_id = 9;
  optional Details_V0 details = 10;
  repeated uint32 tags = 11;
  optional bool development_build = 12;
  optional uint32 publish_timestamp = 13;
}

// k_EMsgClientToGCUpdateHeroBuild = 9193, response 9194: create (hero_build_id 0) or update a build.
message CMsgClientToGCUpdateHeroBuild {
  optional CMsgHeroBuild hero_build = 1;
}

message CMsgClientToGCUpdateHeroBuildResponse {
  // 0 internal error, 1 success, 2 not author, 3 invalid build id, 4 invalid name, 5 name too long,
  // 6 description too long, 7 invalid details, 8 stale version, 9 build too large
  optional uint32 response = 1;
  optional uint32 hero_build_id = 2;
  optional uint32 version = 3;
}
