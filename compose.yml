# Deadlock Analytics. Reached by a reverse proxy over the
# shared external `edge` network as `deadlock-analytics:8000`; no host ports published.
#
#   cp .env.example .env    # add TRACKED_ACCOUNT_IDS (more can be added in the UI)
#   docker compose up -d
#
# Updates: CI publishes ghcr.io/maxalon/deadlockanalytics:latest on every push to main and
# deploys it over Tailscale SSH, or a systemd timer on the box pulls it (README "Deploy").

services:
  web:
    image: ghcr.io/maxalon/deadlockanalytics:latest
    container_name: deadlock-analytics
    restart: unless-stopped
    env_file: .env
    volumes:
      - deadlock_data:/data
    networks:
      - edge
      - default

  # Fetches tracked players' match history and match files through your own Steam bot
  # account. Only on the project's internal network: reachable by `web`, nothing else.
  # One-time login: docker compose run --rm -it fetcher npm run login
  fetcher:
    image: ghcr.io/maxalon/deadlockanalytics-fetcher:latest
    container_name: deadlock-fetcher
    restart: unless-stopped
    env_file: .env
    volumes:
      - fetcher_data:/data
    networks:
      - default

volumes:
  deadlock_data:
  fetcher_data:

networks:
  edge:
    external: true
    name: edge
