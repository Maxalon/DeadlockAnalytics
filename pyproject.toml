[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deadlockanalytics"
version = "0.1.0"
description = "Self-hosted Deadlock match analytics with a reconstruction of Valve's MVP score"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.1",
    "uvicorn[standard]==0.54.0",
    "jinja2==3.1.6",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.11.8"]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 120
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
