<!doctype html>
<html lang="en" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Deadlock Analytics{% endblock %}</title>
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Deadlock Analytics</a>
    <nav>
      <a href="/">Players</a>
      <a href="/accounts">Accounts</a>
      <a href="/model">MVP model</a>
      <a class="theme" href="/theme?to={{ 'dark' if theme == 'light' else 'light' }}&amp;next={{ request.url.path | urlencode }}">{{ "Dark" if theme == "light" else "Light" }} mode</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    // Times in the viewer's own time zone; the server writes UTC.
    for (const t of document.querySelectorAll("time[data-local]")) {
      const d = new Date(t.dateTime);
      t.textContent = d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
      t.title = d.toLocaleString(undefined, { dateStyle: "full", timeStyle: "short" });
    }
  </script>
</body>
</html>
